<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasTime — Projector</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Projector defaults to dark regardless of system preference */
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --text: #f0f0f0;
    --muted: #555;
    --grad-a: #00c9a7;
    --grad-b: #4facfe;
  }

  /* Light mode overrides when data-theme="light" */
  [data-theme="light"] {
    --bg: #f9f9f9;
    --surface: #ffffff;
    --border: #e8e8e8;
    --text: #111;
    --muted: #888;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .proj-wordmark {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .proj-round {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .proj-clock {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    color: var(--muted);
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 40px;
    min-height: 0;
  }

  .ring-wrap { position: relative; flex-shrink: 0; }
  .ring-svg { transform: rotate(-90deg); display: block; }
  .ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .ring-time {
    font-family: 'DM Mono', monospace;
    font-size: 3.2rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }

  .ring-sub {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .act-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
    max-height: 100%;
    overflow-y: auto;
  }

  .single-act-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .single-act-name {
    font-size: clamp(3rem, 6vw, 5rem);
    font-weight: 600;
    letter-spacing: -2px;
    color: var(--text);
    line-height: 1.05;
  }

  .proj-grid { display: grid; gap: 12px; }

  .proj-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-top-width: 3px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }

  .proj-act-name {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .proj-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .proj-chip {
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 1rem;
    font-weight: 500;
  }

  .prog-wrap { height: 4px; background: var(--border); flex-shrink: 0; }
  .prog-bar { height: 100%; background: linear-gradient(90deg, var(--grad-a), var(--grad-b)); transition: width 1s linear; }

  /* Overlay */
  #projOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    animation: projFadeIn 0.25s ease;
  }

  /* Dark overlay bg */
  :root #projOverlay,
  [data-theme="dark"] #projOverlay {
    background: rgba(10,10,10,0.97);
    backdrop-filter: blur(8px);
  }

  /* Light overlay bg */
  [data-theme="light"] #projOverlay {
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(8px);
  }

  #projOverlay.active { display: flex; }

  @keyframes projFadeIn { from { opacity: 0; } to { opacity: 1; } }

  .ov-title {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 600;
    letter-spacing: -3px;
    text-align: center;
    background: linear-gradient(90deg,#ff4d4d,#ff8c00,#ffd000,#4caf50,#2196f3,#9c27b0,#e91e8c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-size: 200% 100%;
    animation: gradShift 2s linear infinite;
  }

  @keyframes gradShift { 0% { background-position: 0%; } 100% { background-position: 200%; } }

  .ov-sub { font-size: 1.1rem; color: var(--muted); text-align: center; }

  .ov-cards {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }

  .ov-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-top-width: 3px;
    padding: 20px 28px;
    text-align: center;
    min-width: 160px;
    box-shadow: var(--shadow);
  }

  .ov-act {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .ov-group { font-size: 1.2rem; font-weight: 600; color: var(--text); }

  .btn-dismiss-proj {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    padding: 16px 40px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 8px;
  }

  :root .btn-dismiss-proj,
  [data-theme="dark"] .btn-dismiss-proj { background: #f0f0f0; color: #111; }
  [data-theme="light"] .btn-dismiss-proj { background: #111; color: #fff; }
  .btn-dismiss-proj:hover { transform: translateY(-1px); opacity: 0.9; }

  .waiting {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100%;
    color: var(--muted);
  }

  .waiting-title {
    font-size: 2rem;
    font-weight: 600;
    background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .waiting-sub { font-size: 0.9rem; }

  /* Ring track colour adapts to theme */
  .ring-track { stroke: var(--border); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="proj-wordmark">CasTime</div>
  <div class="proj-round" id="projRound">—</div>
  <div class="proj-clock" id="projClock">—</div>
</div>

<div class="main" id="projMain">
  <div class="waiting">
    <div class="waiting-title">CasTime</div>
    <div class="waiting-sub">Waiting for session to start…</div>
  </div>
</div>

<div class="prog-wrap"><div class="prog-bar" id="projProg" style="width:0%"></div></div>

<div id="projOverlay">
  <div class="ov-title" id="projOvTitle">Change places!</div>
  <div class="ov-sub" id="projOvSub"></div>
  <div class="ov-cards" id="projOvCards"></div>
  <button class="btn-dismiss-proj" id="projDismissBtn" onclick="dismissFromProjector()">We've moved →</button>
</div>

<script>
  const RAINBOW = ['#ff4d4d','#ff8c00','#ffd000','#4caf50','#2196f3','#9c27b0','#e91e8c'];
  let lastTs = 0;
  let wasOverlayActive = false;

  // ── Theme sync ─────────────────────────────────────────────────────────
  function applyTheme() {
    const saved = localStorage.getItem('castime-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }

  applyTheme();

  window.addEventListener('storage', e => {
    if (e.key === 'castime-theme') applyTheme();
    if (e.key === 'castime-projector') poll();
  });

  // ── Helpers ────────────────────────────────────────────────────────────
  function fmt(secs) {
    const s = Math.max(0, Math.abs(secs));
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  function getTrackColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#222';
  }

  function dismissFromProjector() {
    localStorage.setItem('castime-projector-dismiss', Date.now().toString());
    document.getElementById('projOverlay').classList.remove('active');
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function render(state) {
    if (!state) return;
    const overlayChanged = state.overlayActive !== wasOverlayActive;
    if (state.ts === lastTs && !overlayChanged) return;
    lastTs = state.ts;
    wasOverlayActive = state.overlayActive;

    const { secsLeft, currentSlotSecs, currentRound, totalRounds,
            isSingle, activityName, assignments,
            overlayActive, overlayTitle, overlayCards, isFinalRound } = state;

    document.getElementById('projRound').textContent =
      `Round ${Math.min(currentRound+1, totalRounds)} of ${totalRounds}`;

    const pct = Math.max(0, Math.min(100, (secsLeft / currentSlotSecs) * 100));
    document.getElementById('projProg').style.width = (100-pct) + '%';

    // Overlay
    const overlay = document.getElementById('projOverlay');
    if (overlayActive) {
      overlay.classList.add('active');
      document.getElementById('projOvTitle').textContent = overlayTitle || 'Change places!';
      const cardsEl = document.getElementById('projOvCards');
      const dismissBtn = document.getElementById('projDismissBtn');
      if (isFinalRound) {
        cardsEl.innerHTML = '';
        dismissBtn.textContent = '← Done';
      } else {
        cardsEl.innerHTML = (overlayCards||[]).map(({actName,color,groups}) =>
          `<div class="ov-card" style="border-top-color:${color}">
            <div class="ov-act">${actName}</div>
            <div class="ov-group">${(groups||[]).join(' & ')||'—'}</div>
          </div>`).join('');
        dismissBtn.textContent = isSingle ? "Let's go →" : "We've moved →";
      }
    } else {
      overlay.classList.remove('active');
    }

    // Ring — pick track colour from current theme
    const ringSize = Math.min(200, window.innerHeight * 0.3);
    const r = ringSize * 0.42;
    const circ = 2 * Math.PI * r;
    const offset = circ * (1 - Math.max(0,secsLeft) / currentSlotSecs);
    const trackColor = getTrackColor();

    document.getElementById('projMain').innerHTML = `
      <div class="ring-wrap" style="width:${ringSize}px;height:${ringSize}px;">
        <svg class="ring-svg" width="${ringSize}" height="${ringSize}">
          <circle cx="${ringSize/2}" cy="${ringSize/2}" r="${r}" fill="none"
            stroke="${trackColor}" stroke-width="${(ringSize*0.07).toFixed(1)}"/>
          <circle cx="${ringSize/2}" cy="${ringSize/2}" r="${r}" fill="none"
            stroke="url(#pg)" stroke-width="${(ringSize*0.07).toFixed(1)}"
            stroke-linecap="round"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"/>
          <defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00c9a7"/>
            <stop offset="100%" style="stop-color:#4facfe"/>
          </linearGradient></defs>
        </svg>
        <div class="ring-inner">
          <div class="ring-time">${fmt(secsLeft)}</div>
          <div class="ring-sub">left</div>
        </div>
      </div>
      <div class="act-area" id="actArea"></div>`;

    const actArea = document.getElementById('actArea');
    if (isSingle) {
      actArea.innerHTML = `
        <div>
          <div class="single-act-label">Current activity</div>
          <div class="single-act-name">${activityName}</div>
        </div>`;
    } else {
      const cols = Math.min((assignments||[]).length, 3);
      const grid = document.createElement('div');
      grid.className = 'proj-grid';
      grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
      (assignments||[]).forEach(({actName,color,groups}) => {
        const card = document.createElement('div');
        card.className = 'proj-card';
        card.style.borderTopColor = color;
        card.innerHTML = `
          <div class="proj-act-name">${actName}</div>
          <div class="proj-chips">${(groups||[]).map((g,gi) => {
            const c = RAINBOW[gi%7];
            return `<span class="proj-chip" style="background:${c}22;color:${c}">${g}</span>`;
          }).join('')}</div>`;
        grid.appendChild(card);
      });
      actArea.appendChild(grid);
    }
  }

  function poll() {
    try {
      const raw = localStorage.getItem('castime-projector');
      if (raw) render(JSON.parse(raw));
    } catch(e) {}
  }

  setInterval(poll, 1000);
  poll();

  setInterval(() => {
    const el = document.getElementById('projClock');
    if (el) el.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }, 1000);

  document.addEventListener('keydown', e => {
    if (e.code==='Space' && document.getElementById('projOverlay').classList.contains('active')) {
      e.preventDefault();
      dismissFromProjector();
    }
  });
</script>
</body>
</html>
